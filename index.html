    $(id).setAttribute('aria-pressed', (i === 1) === en);
  });
  
  $('countryLangSelect').value = currentLang;
  $('countryLangSelect').options[0].textContent = en ? 'Japan · Japanese' : '日本 · 日語';
  $('countryLangSelect').options[1].textContent = en ? 'Thailand · Thai' : '泰國 · 泰語';
  
  $('intro').textContent = en ? 'Read it aloud, or tap for details.' : '照着讀，或點一下使用詳細功能。';
  $('footerText').textContent = en ? 'Travel Phrase Sheet v1.0' : '旅行語句貓紙 v1.0';
  $('privacyLink').textContent = en ? 'Privacy Policy' : '私隱政策';
  $('adLabel').textContent = en ? 'Advertisement' : '廣告';
  $('adSlot').setAttribute('aria-label', en ? 'Advertisement' : '廣告');
  $('aboutTitle').textContent = en ? 'About Travel Cheat Sheet' : '關於旅行貓紙';
  $('aboutText').textContent = en
    ? 'Travel Cheat Sheet is a free mobile phrase tool with the most useful Japanese and Thai phrases for shopping, ordering, prices, payment, directions, bookings and asking for help, with Chinese and English meanings and romanisation. When asking a price, open the number pad so staff can type it in.'
    : '旅行貓紙是免費的手機旅行短句工具，收錄日語及泰語在購物、點餐、問價、付款、問路、預約及求助時最常用的句子，附中英對照及羅馬拼音。問價時可開啟數字板，讓店員直接輸入價錢。';
  $('groups').replaceChildren();

  const rows = DB[currentLang].rows;
  const langCode = DB[currentLang].langCode;

  gs.forEach((g, gi) => {
    const d = document.createElement('details');
    d.open = first ? gi === 0 : !!open[gi];
    const s = document.createElement('summary');
    s.innerHTML = icon(g[6]);
    const t = document.createElement('div');
    t.innerHTML = '<strong></strong><small></small>';
    t.children[0].textContent = g[en ? 1 : 0];
    t.children[1].textContent = g[en ? 3 : 2];
    if (anim) t.className = 'fade';
    s.append(t);
    d.append(s);

    for (let i = g[4]; i < g[5]; i++) {
      const r = rows[i], b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = icon(g[6]);
      const c = document.createElement('div');
      c.className = 'content';
      [
        ['target-text', r[0]],
        ['meaning', r[en ? 2 : 1]],
        ['roman', r[3]],
        ['tip', hint(r)],
        ['tip', tips[i][en ? 1 : 0]],
        ['label', en ? 'Details ›' : '詳細 ›']
      ].forEach(([cls, txt]) => {
        if (!txt) return;
        const x = document.createElement('div');
        x.className = cls + (anim && cls !== 'target-text' && cls !== 'roman' ? ' fade' : '');
        x.textContent = txt;
        if (cls === 'target-text') x.lang = langCode;
        c.append(x);
      });
      b.append(c);
      b.onclick = () => openDetail(i, b);
      d.append(b);
    }
    $('groups').append(d);
  });
  first = false;
  if (anim) window.scrollTo(0, y);
}

function activeRow() {
  const rows = DB[currentLang].rows;
  let r = [...rows[current]];

  if (currentLang === 'jp') {
    if (current === 4 && cash) return ['現金で払えますか？', '可以用現金付款嗎？', 'Can I pay in cash?', 'Genkin de haraemasu ka?'];
    if ([0, 1, 2].includes(current) && variant > 0) {
      const v = variant - 1,
            k = ['これ', 'それ', 'あれ'][v],
            ko = ['Kore', 'Sore', 'Are'][v],
            z = ['這個', '對方那個', '遠處那個'][v],
            e = ['this', 'that', 'that over there'][v];
      if (current === 0) r = [k + 'はありますか？', '你們有' + z + '嗎？', 'Do you have ' + e + '?', ko + ' wa arimasu ka?'];
      if (current === 1) r = [k + 'をください。', '請給我' + z + '。', e[0].toUpperCase() + e.slice(1) + ', please.', ko + ' o kudasai'];
      if (current === 2) r = [k + 'はいくらですか？', z + '多少錢？', 'How much is ' + e + '?', ko + ' wa ikura desu ka?'];
    }
  } else if (currentLang === 'th') {
    if (current === 4 && cash) return ['จ่ายเงินสดได้ไหมครับ/ค่ะ?', '可以用現金付款嗎？', 'Can I pay in cash?', 'Jai ngoen sot dai mai khrap/kha?'];
    if ([0, 1, 2].includes(current) && variant > 0) {
      const v = variant - 1,
            k = ['อันนี้', 'อันนั้น', 'อันโน้น'][v],
            ko = ['An nii', 'An nan', 'An noon'][v],
            z = ['這個', '那個', '遠處那個'][v],
            e = ['this', 'that', 'that over there'][v];
      if (current === 0) r = ['มี' + k + 'ไหมครับ/ค่ะ?', '你們有' + z + '嗎？', 'Do you have ' + e + '?', 'Mii ' + ko.toLowerCase() + ' mai khrap/kha?'];
      if (current === 1) r = ['เอา' + k + 'ครับ/ค่ะ', '請給我' + z + '。', e[0].toUpperCase() + e.slice(1) + ', please.', 'Ao ' + ko.toLowerCase() + ' khrap/kha'];
      if (current === 2) r = [k + 'เท่าไหร่ครับ/ค่ะ?', z + '多少錢？', 'How much is ' + e + '?', ko + ' thao rai khrap/kha?'];
    }
  }
  return r;
}

function openDetail(i, b) {
  current = i;
  variant = i < 2 ? 1 : 0;
  cash = false;
  trigger = b;
  savedScroll = window.scrollY;
  document.body.style.top = -savedScroll + 'px';
  document.body.classList.add('locked');
  detailRender();
  $('detail').hidden = false;
  $('detail').scrollTop = 0;
  $('app').inert = true;
  focusNoScroll($('back'));
}

function detailRender() {
  const r = activeRow();
  const langCode = DB[currentLang].langCode;
  $('back').textContent = en ? '‹ Back' : '‹ 返回';
  $('djp').textContent = r[0];
  $('djp').lang = langCode;
  $('dm').textContent = r[en ? 2 : 1];
  $('dr').textContent = r[3];
  $('dt').textContent = hint(r);
  $('options').replaceChildren();
  $('actions').replaceChildren();

  function btn(text, fn, active = false) {
    const b = document.createElement('button');
    b.className = 'plain' + (active ? ' active' : '');
    b.textContent = text;
    b.onclick = fn;
    b.setAttribute('aria-pressed', active);
    return b;
  }

  if ([0, 1, 2].includes(current)) {
    const c = document.createElement('div');
    c.className = 'choices';
    const opts = en ? ['Short', 'This', 'Near them', 'Over there'] : ['簡短問法', '這個', '對方那個', '遠處那個'];
    for (let v = (current === 2 ? 0 : 1); v < 4; v++) {
      c.append(btn(opts[v], () => { variant = v; detailRender(); }, variant === v));
    }
    $('options').append(c);
  }

  if (current === 4) {
    const c = document.createElement('div');
    c.className = 'choices';
    [false, true].forEach(v => c.append(btn(v ? (en ? 'Cash' : '現金') : (en ? 'Card' : '卡'), () => { cash = v; detailRender(); }, cash === v)));
    $('options').append(c);
  }

  const n = document.createElement('p');
  n.className = 'note';
  n.textContent = current === 4 && cash ? (en ? 'Show cash if needed.' : '如需確認，可展示現金。') : tips[current][en ? 1 : 0];
  $('actions').append(n);

  if (current === 2) {
    priceTrigger = btn(en ? 'Enter price' : '輸入價錢', openPad);
    priceTrigger.classList.add('price');
    priceTrigger.removeAttribute('aria-pressed');
    $('actions').append(priceTrigger);
  }
}

function closeDetail() {
  $('detail').hidden = true;
  $('app').inert = false;
  document.body.classList.remove('locked');
  document.body.style.top = '';
  window.scrollTo(0, savedScroll);
  if (trigger) focusNoScroll(trigger);
}
$('back').onclick = closeDetail;

function openPad() {
  if (state !== 'closed') return;
  state = 'opening';
  digits = '';
  const r = activeRow();
  const langCode = DB[currentLang].langCode;
  $('pjp').textContent = r[0];
  $('pjp').lang = langCode;
  $('pm').textContent = r[en ? 2 : 1];
  $('number').textContent = '0';
  $('padtitle').textContent = en ? 'Enter price' : '價錢輸入';
  $('done').textContent = en ? 'Done' : '完成';
  $('padnote').textContent = en ? 'Numbers are not saved.' : '數字只供本次查看，不會保存。';
  
  $('keys').replaceChildren();
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'delete'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'delete' ? '⌫' : k;
    b.setAttribute('aria-label', k === 'delete' ? (en ? 'Delete last digit' : '刪除最後一位') : k);
    b.onclick = () => {
      if (state === 'closing') return;
      if (k === 'delete') digits = digits.slice(0, -1);
      else if (digits.length < 12 && (k !== '.' || !digits.includes('.'))) {
        if (k === '.' && !digits) digits = '0';
        digits += k;
      }
      $('number').textContent = digits || '0';
    };
    $('keys').append(b);
  });

  $('pad').hidden = false;
  $('sheetScroll').scrollTop = 0;
  $('detail').inert = true;
  
  focusNoScroll($('sheet'));
  $('sheetScroll').scrollTop = 0;
  void $('sheet').offsetHeight;
  
  requestAnimationFrame(() => {
    if (state === 'opening') {
      $('pad').classList.add('open');
      state = 'open';
    }
  });
}

function finishClose() {
  clearTimeout(timer);
  $('sheet').removeEventListener('transitionend', onEnd);
  $('pad').hidden = true;
  digits = '';
  $('number').textContent = '0';
  $('sheetScroll').scrollTop = 0;
  $('detail').inert = false;
  state = 'closed';
  if (priceTrigger) focusNoScroll(priceTrigger);
}

function onEnd(e) {
  if (state === 'closing' && e.target === $('sheet') && e.propertyName === 'transform') {
    finishClose();
  }
}

function closePad() {
  if (state === 'closed' || state === 'closing') return;
  state = 'closing';
  $('pad').classList.remove('open');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    finishClose();
  } else {
    $('sheet').addEventListener('transitionend', onEnd);
    timer = setTimeout(finishClose, 600);
  }
}

$('done').onclick = closePad;
$('shade').onclick = closePad;

document.addEventListener('keydown', e => {
  const root = state !== 'closed' ? $('sheet') : (!($('detail').hidden) ? $('detail') : null);
  if (!root) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    state !== 'closed' ? closePad() : closeDetail();
  }
  if (e.key === 'Tab') {
    const elements = [...root.querySelectorAll('button:not([disabled])')];
    const firstEl = elements[0], lastEl = elements[elements.length - 1];
    if (e.shiftKey && (document.activeElement === firstEl || document.activeElement === root)) {
      e.preventDefault();
      lastEl.focus({ preventScroll: true });
    } else if (!e.shiftKey && document.activeElement === lastEl) {
      e.preventDefault();
      firstEl.focus({ preventScroll: true });
    }
  }
});

function change(v) {
  if (v === en) return;
  en = v;
  try { localStorage.setItem('cheat-ui', v ? 'en' : 'zh'); } catch(e) {}
  render(true);
}
$('zh').onclick = () => change(false);
$('en').onclick = () => change(true);

$('countryLangSelect').onchange = (e) => {
  currentLang = e.target.value;
  try { localStorage.setItem('cheat-target-lang', currentLang); } catch(err) {}
  render(true);
};

render();

(function initAd() {
  var cfg = window.ADS_CONFIG || {};
  if (!cfg.client || !cfg.slot) return;
  var unit = $('adUnit');
  unit.setAttribute('data-ad-client', cfg.client);
  unit.setAttribute('data-ad-slot', cfg.slot);
  $('adSlot').hidden = false;
  try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
})();
</script>
</body>
</html>
